name = "jarvis-cron"
main = "src/index.ts"
compatibility_date = "2024-10-22"

# Cron Triggers run in UTC. IST = UTC+5:30, Monday–Saturday.
#   every 30 min 04:00–14:30 UTC = 9:30 AM–8 PM IST → /jobs/tick: an automatic email batch between
#     AUTO_SEND_FROM and AUTO_SEND_UNTIL (default 10 AM–2 PM), otherwise a reply check. Keeps Render awake.
#   13:30 UTC = 19:00 IST → daily report on Telegram
#   every 30 min 19:00–23:30 UTC = 12:30–5:00 AM IST, every day → the night explorer (one area per run)
#   02:30 UTC = 8 AM IST, Tuesday–Saturday → Trading Lab catch-up (saves any session the live checks missed)
#   every 5 min 03:00–10:55 and 13:00–21:55 UTC, Mon–Fri → Trading Lab live checks. Covers NSE (03:45–10:00 UTC)
#     and US hours in both summer and winter time; the API checks each exchange's clock and fetches prices
#     only while that market is open, then saves the day's money right after its close.
# Keep these strings identical to the JOBS map in src/index.ts.
[triggers]
crons = ["*/30 4-14 * * MON-SAT", "30 13 * * MON-SAT", "*/30 19-23 * * *", "30 2 * * TUE-SAT", "*/5 3-10,13-21 * * MON-FRI"]

# Secrets (set with `wrangler secret put`): API_URL, CRON_SECRET
# For local dev, put them in a .dev.vars file (gitignored).

# keep run logs on (Cloudflare dashboard → jarvis-cron → Observability), so each tick's result is visible
[observability]
enabled = true
