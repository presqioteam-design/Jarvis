# Render blueprint: New → Blueprint → pick this repo.
# "sync: false" values are asked for once in the Render dashboard; they never live in git.
services:
  - type: web
    name: jarvis-api
    runtime: docker
    plan: free
    region: singapore
    # built from the repo root so the image also gets tradinglab/ (the Trading Lab)
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - apps/api/**
        - tradinglab/**
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # who Jarvis works for
      - key: JARVIS_UID
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      # Firebase: paste the whole service-account.json file contents
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # the dashboard's address on Cloudflare Pages, e.g. https://presqio-jarvis.pages.dev
      - key: CORS_ORIGINS
        sync: false
      # shared with the Cloudflare cron worker
      - key: CRON_SECRET
        generateValue: true
      # AI
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # hotel search
      - key: TOMTOM_API_KEY
        sync: false
      # outreach Gmail
      - key: EMAIL_ADDRESS
        sync: false
      # Render's free plan blocks email ports, so send and read through the Gmail API (HTTPS).
      # Get these with: cd apps/api && .venv/bin/python -m scripts.gmail_token client_secret.json
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: SENDER_NAME
        value: Presqio Team
      - key: DAILY_EMAIL_CAP
        value: "50"
      # Telegram: webhook mode registers itself on startup using RENDER_EXTERNAL_URL
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # letters, digits, _ and - only (Telegram rejects other characters): openssl rand -hex 24
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Trading Lab prices (Financial Modeling Prep): daily candles, and 1-minute candles
      - key: INTRADAY_HISTORICAL_URL
        value: https://financialmodelingprep.com/stable/historical-price-eod/full
      - key: INTRADAY_HISTORICAL_API
        sync: false
      - key: INTRADAY_1MIN_URL
        value: https://financialmodelingprep.com/stable/historical-chart/1min
      - key: INTRADAY_1MIN_API
        sync: false
